# PlanBound settlement index — Worldchain mainnet USDC.
#
# Network identifier `worldchain` is the one The Graph documents for World Chain mainnet
# (thegraph.com/docs/en/supported-networks, checked 2026-07-25). Not guessed.
#
# USDC 0x79A02482A880bCE3F13e09Da970dC34db4CD24d1 — verified live on 2026-07-25:
# contract code present, decimals() == 6, symbol() == "USDC".
#
# startBlock 32820000 == 2026-07-25T10:33:59Z (verified by eth_getBlockByNumber). Recent by
# design: ~19k blocks to head at deploy time, so this syncs in minutes rather than days.
# The cost of that choice is that the honest claim is "settled since deployment" and never
# "this month" — IndexMeta carries the real window so the UI prints it instead of asserting it.
#
# No address filter. Measured 2026-07-25: Worldchain USDC emits ~1.2 Transfer events per
# 2s block (~52k/day), so indexing every transfer is cheap. See subgraph/README.md for why
# that beats a manifest-time address registry.
specVersion: 1.3.0
description: PlanBound — USDC settlements on Worldchain, for claimed-vs-settled verification and seller trust.
repository: https://github.com/idoamram/planbound
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: USDC
    network: worldchain
    source:
      address: "0x79A02482A880bCE3F13e09Da970dC34db4CD24d1"
      abi: ERC20
      startBlock: 32820000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Settlement
        - Seller
        - Payer
        - PayerSeller
        - IndexMeta
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
