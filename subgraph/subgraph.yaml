# PlanBound settlement index — Base mainnet USDC.
#
# Network was Worldchain until 2026-07-25 ~23:20, when Subgraph Studio refused the deploy:
# "Subgraphs no longer supported on WorldChain". The docs' supported-networks page still
# listed it, and `graph build` does not validate network names — so this only surfaced at
# deploy time, against a fully built and tested subgraph. Recorded in .feedbacks/thegraph.md.
#
# Base is unambiguously supported and is where our EVM settlements now land, so this panel
# indexes our own money rather than an empty chain.
#
# USDC 0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913 — verified live 2026-07-25: decimals() == 6.
#
# startBlock 49111773 — ~3000 blocks (~100 min) behind head at deploy time. Recent by design
# so this syncs in minutes; the cost is that the honest claim stays "settled since
# deployment", never "this month". IndexMeta carries the real window so the UI prints it.
#
# No address filter: plan wallets do not exist when the manifest is written, and sellers are
# discovered at runtime. See subgraph/README.md.
specVersion: 1.3.0
description: PlanBound — USDC settlements on Base, for claimed-vs-settled verification and seller trust.
repository: https://github.com/idoamram/planbound
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: USDC
    network: base
    source:
      address: "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
      abi: ERC20
      startBlock: 49111773
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Settlement
        - Seller
        - Payer
        - PayerSeller
        - IndexMeta
      abis:
        - name: ERC20
          file: ./abis/ERC20.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
